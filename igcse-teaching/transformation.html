<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Transformations Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better aesthetics and readability */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 95%;
            margin: 1rem auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }
        canvas {
            border: 2px solid #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 1rem;
            /* Added touch-action: none to prevent scrolling/zooming during drag/drop */
            touch-action: none; 
        }
        input[type="number"], select {
            border: 1px solid #d1d5db;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            background-color: #f9fafb;
        }
        input[type="number"]:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            outline: none;
        }
    </style>
</head>
<body class="p-4">

<div class="container">
    <!-- Left Panel: Canvas -->
    <div class="lg:col-span-2 flex justify-center items-center">
        <canvas id="transformationCanvas" width="500" height="500" class="w-full lg:w-[500px] h-auto aspect-square"></canvas>
    </div>

    <!-- Right Panel: Controls -->
    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Transformation Controls</h1>
        
        <!-- Interactive Shape Definition -->
        <div class="mb-6 pb-4 border-b">
            <h2 class="text-xl font-bold mb-3 text-gray-800">Define Pre-Image (Drag Points)</h2>
            
            <div class="mb-3">
                <label for="vertexCount" class="block text-sm font-medium text-gray-700 mb-1">Number of Vertices:</label>
                <!-- initializeShape is called on change -->
                <select id="vertexCount" onchange="initializeShape(parseInt(this.value))" class="w-full">
                    <option value="1">1 (Point)</option>
                    <option value="2">2 (Line Segment)</option>
                    <option value="3" selected>3 (Triangle - Default)</option>
                    <option value="4">4 (Quadrilateral)</option>
                    <option value="5">5 (Pentagon)</option>
                    <option value="6">6 (Hexagon)</option>
                </select>
            </div>
            <p class="text-sm text-indigo-600 font-semibold p-2 bg-indigo-50 rounded-lg">
                <span class="font-black">ACTION:</span> Drag the **blue points** on the grid to define your shape.
            </p>
        </div>
        <!-- End Interactive Shape Definition -->

        <!-- Transformation Type Selector -->
        <div class="mb-4">
            <label for="transformType" class="block text-sm font-medium text-gray-700 mb-1">Select Transformation:</label>
            <select id="transformType" onchange="updateControls()" class="w-full">
                <option value="translation">1. Translation</option>
                <option value="reflection">2. Reflection</option>
                <option value="rotation">3. Rotation</option>
                <option value="enlargement">4. Enlargement</option>
            </select>
        </div>

        <!-- Dynamic Controls Container -->
        <div id="controlsContainer" class="space-y-3 mb-6">
            <!-- Controls will be injected here by JavaScript -->
        </div>

        <!-- Pre-Image Coordinates Display (Dynamic) -->
        <h2 class="text-lg font-semibold mt-6 mb-2 text-gray-700">Current Pre-Image Coordinates:</h2>
        <div id="vertexCoordsList" class="space-y-1 text-sm p-3 bg-gray-50 border-l-4 border-gray-300 rounded-lg font-mono text-gray-800">
            <!-- Coordinates are injected and updated during dragging -->
        </div>


        <!-- Result Coordinates Display -->
        <h2 class="text-lg font-semibold mt-6 mb-2 text-gray-700">Image Coordinates (A', B', C', ...):</h2>
        <div id="resultCoords" class="text-sm p-3 bg-blue-50 border-l-4 border-blue-400 rounded-lg font-mono text-gray-800">
            A'(...), B'(...), C'(...)
        </div>
    </div>
</div>

<script>
    // --- Canvas Setup and Global Variables ---
    const canvas = document.getElementById('transformationCanvas');
    const ctx = canvas.getContext('2d');
    const controlsContainer = document.getElementById('controlsContainer');
    const resultCoordsDiv = document.getElementById('resultCoords');
    const transformTypeSelect = document.getElementById('transformType');
    const vertexCoordsList = document.getElementById('vertexCoordsList');

    // World coordinates (standard IGCSE range)
    const W_MIN = -10;
    const W_MAX = 10;
    const GRID_STEP = 1;
    let C_SIZE = 500; // Default canvas size

    // Shape and Dragging State
    let originalShape = [];
    let transformedShape = [];
    let isDragging = false;
    let draggedPointIndex = -1;

    // --- Coordinate System Helpers ---

    // Function to map world coordinates (e.g., -10 to 10) to pixel coordinates (0 to 500)
    function worldToPixel(x, y) {
        const range = W_MAX - W_MIN;
        const px = (x - W_MIN) / range * C_SIZE;
        // In canvas, y=0 is top, so we flip the Y coordinate
        const py = C_SIZE - ((y - W_MIN) / range * C_SIZE);
        return { px, py };
    }

    // Function to map pixel coordinates to world coordinates
    function pixelToWorld(px, py) {
        const range = W_MAX - W_MIN;
        const x = (px / C_SIZE) * range + W_MIN;
        // Remember Y is flipped in canvas
        const y = ((C_SIZE - py) / C_SIZE) * range + W_MIN;
        
        // Round coordinates to nearest 0.5 for controlled snapping/movement
        const STEP = 0.5; 
        return {
            x: Math.round(x / STEP) * STEP,
            y: Math.round(y / STEP) * STEP
        };
    }

    // Function to draw the coordinate plane
    function drawAxis() {
        ctx.clearRect(0, 0, C_SIZE, C_SIZE);

        const center = worldToPixel(0, 0);

        // Grid lines (light gray)
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        for (let i = W_MIN; i <= W_MAX; i += GRID_STEP) {
            const { px: x, py: y } = worldToPixel(i, i);

            // Vertical lines
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, C_SIZE);
            ctx.stroke();

            // Horizontal lines
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(C_SIZE, y);
            ctx.stroke();
        }

        // Axes (darker gray)
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 2;

        // X-axis
        ctx.beginPath();
        ctx.moveTo(0, center.py);
        ctx.lineTo(C_SIZE, center.py);
        ctx.stroke();

        // Y-axis
        ctx.beginPath();
        ctx.moveTo(center.px, 0);
        ctx.lineTo(center.px, C_SIZE);
        ctx.stroke();

        // Labels
        ctx.fillStyle = '#1f2937';
        ctx.font = '12px Inter';
        for (let i = W_MIN; i <= W_MAX; i += GRID_STEP) {
            if (i === 0) continue;

            // X-axis labels
            const { px: x, py: y } = worldToPixel(i, 0);
            ctx.fillText(i, x - (i < 0 ? 15 : 5), center.py + 15);

            // Y-axis labels
            const { px: x2, py: y2 } = worldToPixel(0, i);
            ctx.fillText(i, center.px + 5, y2 + 5);
        }
    }

    // Function to draw a shape (polygon, line, or point)
    function drawShape(shape, color, fill = false) {
        if (shape.length === 0) return;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.fillStyle = fill ? color + '40' : 'transparent'; // Add transparency for fill

        if (shape.length > 1) { // Line Segment or Polygon
            ctx.beginPath();
            const start = worldToPixel(shape[0].x, shape[0].y);
            ctx.moveTo(start.px, start.py);

            for (let i = 1; i < shape.length; i++) {
                const { px, py } = worldToPixel(shape[i].x, shape[i].y);
                ctx.lineTo(px, py);
            }

            if (shape.length > 2) { // Polygon (3+ vertices)
                ctx.closePath();
                if (fill) {
                    ctx.fill();
                }
            }
            ctx.stroke();
        } 
        
        // Draw points and labels (always required)
        ctx.font = '14px Inter';
        ctx.fillStyle = color;
        shape.forEach(point => {
            const { px, py } = worldToPixel(point.x, point.y);
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2); // Increased point size for dragging
            ctx.fill();

            // Label position adjusted slightly
            ctx.fillText(point.label, px + 10, py - 10);
        });
    }

    // --- Core Transformation Functions (Unchanged) ---

    function translate(point, tx, ty) {
        return {
            label: point.label + "'",
            x: point.x + tx,
            y: point.y + ty,
        };
    }

    function reflect(point, line) {
        let x = point.x;
        let y = point.y;
        let newX, newY;

        switch (line) {
            case 'x-axis': newX = x; newY = -y; break;
            case 'y-axis': newX = -x; newY = y; break;
            case 'y=x': newX = y; newY = x; break;
            case 'y=-x': newX = -y; newY = -x; break;
            default: newX = x; newY = y;
        }

        return { label: point.label + "'", x: newX, y: newY };
    }

    function rotate(point, angleDeg, cx, cy) {
        const angleRad = angleDeg * (Math.PI / 180);
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);

        const translatedX = point.x - cx;
        const translatedY = point.y - cy;

        const rotatedX = translatedX * cos - translatedY * sin;
        const rotatedY = translatedX * sin + translatedY * cos;

        const newX = rotatedX + cx;
        const newY = rotatedY + cy;

        return {
            label: point.label + "'",
            x: Math.round(newX * 100) / 100, // Rounding for precision
            y: Math.round(newY * 100) / 100,
        };
    }

    function enlarge(point, scale, cx, cy) {
        const newX = cx + scale * (point.x - cx);
        const newY = cy + scale * (point.y - cy);

        return { label: point.label + "'", x: newX, y: newY };
    }

    // --- Interactive Shape Management ---

    // Function to initialize or reset the shape based on vertex count
    function initializeShape(count) {
        originalShape = [];
        const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
        
        if (count === 1) {
            // Single Point (A)
            originalShape.push({ label: 'A', x: 2, y: 2 });
        } else if (count === 2) {
            // Line Segment (A-B)
            originalShape.push({ label: 'A', x: 2, y: 2 });
            originalShape.push({ label: 'B', x: 5, y: 2 });
        } else {
            // Polygon (3+ vertices)
            // Create a simple initial shape (e.g., a polygon slightly off-center)
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * 2 * Math.PI;
                const radius = 3;
                // Place points in Q1/Q4 by default
                originalShape.push({
                    label: labels[i],
                    x: Math.round((3 + radius * Math.cos(angle)) * 10) / 10,
                    y: Math.round((3 + radius * Math.sin(angle)) * 10) / 10,
                });
            }
        }
        applyTransformation(); // Redraw with the new shape
    }

    // Function to update coordinates display panel
    function updateCoordinatesDisplay() {
        // Update pre-image coordinates list
        const preImageHtml = originalShape.map(p => 
            `<div class="flex justify-between">
                <span>${p.label}:</span>
                <span class="text-blue-600 font-bold">(${p.x}, ${p.y})</span>
             </div>`
        ).join('');
        vertexCoordsList.innerHTML = preImageHtml || 'No points defined.';
        
        // Update image coordinates
        const imageCoords = transformedShape.map(p => `${p.label}'(${p.x}, ${p.y})`).join(', ');
        resultCoordsDiv.textContent = imageCoords || 'A\'(...), B\'(...), C\'(...)';
    }


    // --- Main Update and Drawing Loop ---

    function redraw() {
        drawAxis();
        drawShape(originalShape, '#3b82f6', true); // Original: Blue
        drawShape(transformedShape, '#ef4444', true);  // Transformed: Red
        updateCoordinatesDisplay(); // Update all displays
    }

    function applyTransformation() {
        // Ensures the display is cleared of any prior error messages
        resultCoordsDiv.classList.remove('bg-red-100', 'border-red-500');
        
        const type = transformTypeSelect.value;
        const params = {};

        // Extract parameters based on the current transformation type
        switch (type) {
            case 'translation':
                // These elements are guaranteed to exist now due to the loading order fix
                params.tx = parseFloat(document.getElementById('tx').value) || 0;
                params.ty = parseFloat(document.getElementById('ty').value) || 0;
                transformedShape = originalShape.map(p => translate(p, params.tx, params.ty));
                break;

            case 'reflection':
                params.line = document.getElementById('reflectionLine').value;
                transformedShape = originalShape.map(p => reflect(p, params.line));
                drawReflectionLine(params.line);
                break;

            case 'rotation':
                params.angle = parseFloat(document.getElementById('rotationAngle').value) || 0;
                params.cx = parseFloat(document.getElementById('rcx').value) || 0;
                params.cy = parseFloat(document.getElementById('rcy').value) || 0;
                transformedShape = originalShape.map(p => rotate(p, params.angle, params.cx, params.cy));
                drawCenter(params.cx, params.cy, 'Rotation Center', '#3b82f6');
                break;

            case 'enlargement':
                params.scale = parseFloat(document.getElementById('scaleFactor').value) || 1;
                params.cx = parseFloat(document.getElementById('ecx').value) || 0;
                params.cy = parseFloat(document.getElementById('ecy').value) || 0;
                transformedShape = originalShape.map(p => enlarge(p, params.scale, params.cx, params.cy));
                drawCenter(params.cx, params.cy, 'Enlargement Center', '#3b82f6');
                break;
        }

        redraw();
    }

    // --- Transformation Aids Drawing ---

    function drawReflectionLine(line) {
        ctx.strokeStyle = '#34d399'; // Green for aid
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]); // Dashed line
        ctx.beginPath();

        const { px: cX, py: cY } = worldToPixel(0, 0);

        if (line === 'x-axis') {
            ctx.moveTo(0, cY); ctx.lineTo(C_SIZE, cY);
        } else if (line === 'y-axis') {
            ctx.moveTo(cX, 0); ctx.lineTo(cX, C_SIZE);
        } else if (line === 'y=x') {
            ctx.moveTo(0, C_SIZE); ctx.lineTo(C_SIZE, 0);
        } else if (line === 'y=-x') {
            ctx.moveTo(0, 0); ctx.lineTo(C_SIZE, C_SIZE);
        }
        ctx.stroke();
        ctx.setLineDash([]); // Reset line style
    }

    function drawCenter(cx, cy, label, color) {
        const { px, py } = worldToPixel(cx, cy);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '12px Inter';
        ctx.fillText(label, px + 8, py - 8);
    }

    // --- Draggable Logic ---

    // Get canvas-local coordinates from mouse/touch event
    function getCanvasCoords(event) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;

        if (event.touches && event.touches.length > 0) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
        } else {
            clientX = event.clientX;
            clientY = event.clientY;
        }

        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handleDown(event) {
        const { x, y } = getCanvasCoords(event);
        
        // Check if the click/touch is near a point
        for (let i = 0; i < originalShape.length; i++) {
            const p = originalShape[i];
            const { px, py } = worldToPixel(p.x, p.y);
            
            // Check distance (15 pixels tolerance)
            const dist = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
            if (dist < 15) {
                isDragging = true;
                draggedPointIndex = i;
                event.preventDefault(); // Prevent text selection/default behavior during drag
                return;
            }
        }
    }

    function handleMove(event) {
        if (!isDragging || draggedPointIndex === -1) return;
        
        const { x, y } = getCanvasCoords(event);
        
        // Calculate new world coordinates based on mouse position
        const newWorldCoords = pixelToWorld(x, y);
        
        // Update the dragged point's coordinates
        originalShape[draggedPointIndex].x = newWorldCoords.x;
        originalShape[draggedPointIndex].y = newWorldCoords.y;
        
        // Prevent default scroll/selection
        event.preventDefault();

        // Redraw the canvas and recalculate transformation
        applyTransformation();
    }

    function handleUp() {
        isDragging = false;
        draggedPointIndex = -1;
    }

    // Register drag event listeners (Mouse and Touch)
    canvas.addEventListener('mousedown', handleDown);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleUp);
    canvas.addEventListener('mouseleave', handleUp); 
    canvas.addEventListener('touchstart', handleDown);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('touchend', handleUp);

    // --- UI Control Injection ---

    const templates = {
        translation: `
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col">
                    <label for="tx" class="text-xs font-medium text-gray-600">x</label>
                    <input type="number" id="tx" value="4" oninput="applyTransformation()" class="mt-1" />
                </div>
                <div class="flex flex-col">
                    <label for="ty" class="text-xs font-medium text-gray-600">y</label>
                    <input type="number" id="ty" value="-3" oninput="applyTransformation()" class="mt-1" />
                </div>
            </div>
        `,
        reflection: `
            <div class="flex flex-col">
                <label for="reflectionLine" class="text-xs font-medium text-gray-600">Line of Reflection:</label>
                <select id="reflectionLine" onchange="applyTransformation()" class="mt-1">
                    <option value="x-axis">x-axis (y=0)</option>
                    <option value="y-axis">y-axis (x=0)</option>
                    <option value="y=x">The line y=x</option>
                    <option value="y=-x">The line y=-x</option>
                </select>
            </div>
        `,
        rotation: `
            <div class="space-y-3">
                <div class="flex flex-col">
                    <label for="rotationAngle" class="text-xs font-medium text-gray-600">Angle (Degrees):</label>
                    <select id="rotationAngle" onchange="applyTransformation()" class="mt-1">
                        <option value="90">90° (Clockwise)</option>
                        <option value="-90">-90° (Anti-Clockwise)</option>
                        <option value="180">180°</option>
                        <option value="270">270° (Clockwise)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col">
                        <label for="rcx" class="text-xs font-medium text-gray-600">Center x-coordinate</label>
                        <input type="number" id="rcx" value="0" oninput="applyTransformation()" class="mt-1" />
                    </div>
                    <div class="flex flex-col">
                        <label for="rcy" class="text-xs font-medium text-gray-600">Center y-coordinate</label>
                        <input type="number" id="rcy" value="0" oninput="applyTransformation()" class="mt-1" />
                    </div>
                </div>
            </div>
        `,
        enlargement: `
            <div class="space-y-3">
                <div class="flex flex-col">
                    <label for="scaleFactor" class="text-xs font-medium text-gray-600">Scale Factor (k)</label>
                    <input type="number" id="scaleFactor" value="2" oninput="applyTransformation()" class="mt-1" step="0.5" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col">
                        <label for="ecx" class="text-xs font-medium text-gray-600">Center x-coordinate</label>
                        <input type="number" id="ecx" value="0" oninput="applyTransformation()" class="mt-1" />
                    </div>
                    <div class="flex flex-col">
                        <label for="ecy" class="text-xs font-medium text-gray-600">Center y-coordinate</label>
                        <input type="number" id="ecy" value="0" oninput="applyTransformation()" class="mt-1" />
                    </div>
                </div>
            </div>
        `
    };

    function updateControls() {
        const type = transformTypeSelect.value;
        controlsContainer.innerHTML = templates[type];
        applyTransformation(); // Re-apply transformation with new default values
    }

    // --- Initialization and Responsiveness ---

    // Function to handle canvas resize and ensure it's square
    function resizeCanvas() {
        const containerWidth = canvas.parentNode.clientWidth;
        C_SIZE = Math.min(containerWidth, 500); // Max size of 500px, but responsive
        canvas.width = C_SIZE;
        canvas.height = C_SIZE;
        redraw();
    }

    // Initial setup
    window.onload = () => {
        // FIX: Swapped the order of updateControls and initializeShape.
        // 1. Set initial controls first to populate the DOM elements (like 'tx', 'ty'). 
        //    'updateControls' also calls 'applyTransformation' safely after injection.
        updateControls();
        
        // 2. Initialize the default shape (Triangle). This sets the shape coordinates
        //    and calls 'applyTransformation' again, which draws the final correct image.
        initializeShape(3);
        
        // 3. Size and draw the canvas
        resizeCanvas();

        // Listen for window resize to maintain responsiveness
        window.addEventListener('resize', resizeCanvas);
    };

</script>
</body>
</html>
