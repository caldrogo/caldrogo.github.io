<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applets for Teaching</title>
  <style>
    :root {
      --gap: clamp(12px, 2vw, 24px);
      --page-padding: clamp(16px, 4vw, 56px);
      --radius: 16px;
      --text: #172033;
      --muted: #5d6678;
      --background: #f5f7fb;
      --card: #ffffff;
      --shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    header {
      padding: clamp(32px, 6vw, 80px) var(--page-padding)
               clamp(24px, 4vw, 48px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    /*
      The grid automatically chooses as many columns as will fit.
      Each square has a minimum width, but expands naturally on larger
      screens. The aspect-ratio keeps every tile square.
    */
    .applets-grid {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 0 var(--page-padding) clamp(40px, 6vw, 80px);

      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 220px), 1fr)
      );
      gap: var(--gap);
    }

    .applet {
      position: relative;
      aspect-ratio: 1 / 1;
      min-width: 0;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);

      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .applet:hover,
    .applet:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 14px 32px rgba(23, 32, 51, 0.15);
    }

    .applet:focus-visible {
      outline: 3px solid #4f7cff;
      outline-offset: 3px;
    }

    .applet-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .applet-content {
      position: absolute;
      inset: auto 0 0;
      padding: clamp(16px, 2vw, 24px);

      color: white;
      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, 0.78),
          rgba(0, 0, 0, 0.45) 55%,
          transparent
        );
    }

    .applet-title {
      margin: 0 0 6px;
      font-size: clamp(1.05rem, 1.7vw, 1.4rem);
      line-height: 1.15;
    }

    .applet-description {
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .applets-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .applet-content {
        padding: 12px;
      }

      .applet-description {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Applets for Teaching</h1>
      <h3>by Mr. Milloy</h3>
  </header>

  <main class="applets-grid">

    <!-- Replace each example below with your applet details -->

    <a class="applet" href="circle-theorems.html">
      <img
        class="applet-image"
        src="../assets/img/portfolio/circle_theorems.png"
        alt=""
      >
      <div class="applet-content">
        <h2 class="applet-title">Circle Theorems</h2>
        <p class="applet-description">
          Investigating the geometric properties of the circle theorems
        </p>
      </div>
    </a>

    <a class="applet" href="transformation.html">
      <img
        class="applet-image"
        src="../assets/img/portfolio/transformations.png"
        alt=""
      >
      <div class="applet-content">
        <h2 class="applet-title">Transformations</h2>
        <p class="applet-description">
          Interactive activity of the main geometric transformations
        </p>
      </div>
    </a>



    <!-- Add as many applets as required -->

  </main>

</body>
</html>
